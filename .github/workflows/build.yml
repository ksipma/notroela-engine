name: Build whisper-cli engine binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for the binaries"
        required: true
        default: "v1"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
      - name: Install Vulkan build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-tools spirv-headers
      - name: Build
        run: |
          cmake -B build -S whisper.cpp -DGGML_VULKAN=1 -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j"$(nproc)"
      - name: Verify Vulkan backend
        run: |
          ./build/bin/whisper-cli --version
          ./build/bin/whisper-cli --help 2>&1 | grep -i vulkan || echo "no vulkan banner (check build)"
      - name: Package
        run: tar czf whisper-cli-linux-x64.tar.gz -C build/bin whisper-cli
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: whisper-cli-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.3.296.0"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK-Installer.exe
          Start-Process -FilePath ".\VulkanSDK-Installer.exe" -ArgumentList "/S" -Wait
          $sdk = (Get-ChildItem "C:\VulkanSDK" | Select-Object -First 1).FullName
          if (-not $sdk) { throw "Vulkan SDK niet geinstalleerd" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Using Vulkan SDK: $sdk"
      - name: Build
        shell: pwsh
        run: |
          cmake -B build -S whisper.cpp -DGGML_VULKAN=1 -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/Release/whisper-cli.exe -DestinationPath whisper-cli-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: whisper-cli-win-x64.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
      - name: Build
        run: |
          cmake -B build -S whisper.cpp -DGGML_METAL=1 -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"
      - name: Package
        run: tar czf whisper-cli-macos-arm64.tar.gz -C build/bin whisper-cli
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: whisper-cli-macos-arm64.tar.gz

  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
      - name: Build
        run: |
          cmake -B build -S whisper.cpp -DGGML_METAL=1 -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"
      - name: Package
        run: tar czf whisper-cli-macos-x64.tar.gz -C build/bin whisper-cli
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: whisper-cli-macos-x64.tar.gz

  release:
    needs: [build-linux, build-windows, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - name: Collect assets
        run: |
          mkdir -p assets
          find dist -name "*.tar.gz" -o -name "*.zip" | xargs -I{} mv {} assets/
          ls -la assets/
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v1' }}
        run: |
          gh release create "$TAG" assets/* --title "whisper-cli $TAG" --notes "whisper-cli binaries (Vulkan/Metal) for Notroela" || true
          gh release upload "$TAG" assets/* --clobber